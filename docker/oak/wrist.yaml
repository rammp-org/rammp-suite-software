# OAK-D Pro as a wrist camera: RealSense-compatible topics, near-field depth.
#
#   /opt/ros/humble/lib/depthai_ros_driver_v3/driver_node --ros-args \
#       -r __node:=wrist_camera --params-file /etc/rammp/oak/wrist.yaml \
#       -p driver.i_ip:=<camera address>
#
# The node is run directly, not through driver.launch.py: with rs_compat that
# launch file forces a /camera namespace (and namespace:=/ crashes it), so it
# cannot produce the /wrist_camera/... topics the D405 publishes. Everything
# rs_compat:=true would have set is spelled out below instead. The camera's
# address is deliberately absent — it belongs to the deployment.
/**:
  ros__parameters:
    driver:
      i_rs_compat: true
      # Dot projector: the wrist mostly sees textureless surfaces up close.
      i_enable_ir: true
      i_publish_tf_from_calibration: true
      i_tf_tf_prefix: wrist_camera
      i_tf_base_frame: wrist_camera
      i_tf_parent_frame: wrist_camera_link
    pipeline_gen:
      i_pipeline_type: RGBD
      i_nn_type: none
      i_enable_imu: false
      i_enable_sync: true
    color:
      i_synced: true
      i_width: 640
      i_height: 400
      i_fps: 30.0
    # rs_compat renames the stereo section to `depth` (and rgb to `color`);
    # under `stereo:` these are silently ignored.
    depth:
      i_synced: true
      i_width: 640
      i_height: 400
      i_fps: 30.0
      i_depth_preset: ROBOTICS
      # Doubles the disparity search range, which is what halves the minimum
      # depth; 640x400 halves it again versus 800P.
      i_extended_disp: true
      i_lr_check: true
      i_subpixel: true
